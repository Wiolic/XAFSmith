[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xafsmith"
version = "0.2.0"
description = "通用 XAFS（XANES + EXAFS）数据处理与拟合工具：命令行 + 图形界面，基于 xraylarch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Eggy" }, { name = "Claude (Anthropic)" }]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
keywords = ["XAFS", "EXAFS", "XANES", "synchrotron", "FEFF", "larch"]
dependencies = [
    "xraylarch",
    "xraydb",
    "lmfit",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pymatgen",
    "streamlit",
    "plotly",
    "openpyxl",
    "pywebview",
]

[project.urls]
Homepage = "https://github.com/Wiolic/XAFSmith"

[project.scripts]
xafsmith = "xafsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xafsmith = ["templates/*", "docs/*.md", "assets/*"]
