[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xafsmith"
version = "0.5.1"
description = "可连接 AI 助手（agent）的同步辐射 XAFS（XANES + EXAFS）分析软件：图形界面 + 命令行，基于 xraylarch / FEFF。Agent-ready synchrotron XAFS analysis software."
readme = "README.md"
license = { file = "LICENSE" }   # PolyForm Noncommercial 1.0.0
requires-python = ">=3.10"
authors = [{ name = "Eggy" }, { name = "Claude (Anthropic)" }]
classifiers = ["License :: Other/Proprietary License", "Programming Language :: Python :: 3"]
keywords = ["XAFS", "EXAFS", "XANES", "synchrotron", "FEFF", "larch"]
dependencies = [
    "xraylarch",
    "xraydb",
    "lmfit",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pymatgen",
    "openpyxl",
    "PySide6>=6.5",
]

[project.optional-dependencies]
# 直接生成 Origin 工程（.opju）：需要本机装有 Origin 2021 及以上；没有时“图片导出”只写数据与 build_origin.py
origin = ["originpro"]
# 开发与测试：python -m pytest tests/unit
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Wiolic/XAFSmith"

[project.scripts]
xafsmith = "xafsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xafsmith = ["templates/*", "docs/*.md", "docs/images/basics/*/*.png", "assets/*"]
