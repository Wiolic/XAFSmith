name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # 每周一：上游依赖变化的早期预警（upstream 任务）

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt 的 offscreen 平台在 Linux 上仍需要这些系统库
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests tools

      - name: Unit tests and numerical benchmarks
        run: python -m pytest -q --cov=xafsmith --cov-report=term

      - name: GUI test (offscreen, public demo project)
        run: python tests/test_qt.py

  # 只在每周定时与手动运行时执行：故意越过 pyproject 的上界，装上游最新版，抓上游变化。
  # 失败不影响 push / PR 的检查（它们不运行此任务）。
  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: upstream latest / ubuntu / Python 3.12
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install, then upgrade past the upper bounds
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade --upgrade-strategy eager xraylarch xraydb lmfit numpy scipy   # pip 的依赖冲突警告可忽略
          python -m pip list

      - name: Unit tests and numerical benchmarks
        run: python -m pytest -q
