name: Release

# 推送 v* 标签（如 v1.0.0）时：用 packaging/build.ps1 构建 Windows 安装程序 + 便携 zip（含 pytest、体积护栏、冒烟测试），
# 并附 SHA256SUMS.txt 发布到同名 GitHub Release。1.0 只发 Windows；macOS 任务仅在手动运行时试验构建，不发布。
# 手动运行（workflow_dispatch）只上传为 workflow 产物，不发布 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Version from pyproject
        id: ver
        shell: bash
        run: |
          python -m pip install -e . -c packaging/constraints-win-py312.txt --quiet
          echo "v=$(python -c "import xafsmith;print(xafsmith.__version__)")" >> "$GITHUB_OUTPUT"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.ver.outputs.v }}" || (echo "标签 $GITHUB_REF_NAME 与 xafsmith.__version__ ${{ steps.ver.outputs.v }} 不一致" && exit 1)
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (venv, pytest, PyInstaller, size guard, smoke test, installer, zip)
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/XAFSmith-*-Setup.exe
            dist/XAFSmith-*-portable.zip
            dist/SHA256SUMS.txt

  macos:
    if: github.event_name == 'workflow_dispatch'      # 仅手动试验；1.x 再并入发布
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . pyinstaller
      - name: Build (PyInstaller)
        run: python -m PyInstaller packaging/xafsmith.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Smoke test
        run: |
          dist/XAFSmith/xafsmith-cli --version
      - name: dmg
        run: |
          VER=$(python -c "import xafsmith;print(xafsmith.__version__)")
          hdiutil create -volname XAFSmith -srcfolder dist/XAFSmith.app -ov -format UDZO "dist/XAFSmith-${VER}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/XAFSmith-*-macos.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
